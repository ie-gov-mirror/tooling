name: backfill

# One-time initial mirror of a namespace. Manual only: this is the job that
# creates repositories, and repository creation is the rate-limited,
# hardest-to-undo part of the whole exercise. Run smallest namespace first.

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Upstream namespace to backfill"
        required: true
        type: choice
        options:
          # Ordered smallest first: run them in this order.
          - derilinx                    # 1 repo   (extended)
          - Geological-Survey-Ireland   # 2 repos
          - MetEireann                  # 3 repos
          - localgovdrupal              # 3 repos  (extended)
          - revenue-ie                  # 5 repos
          - ogcio                       # 6 repos, includes 2 large forks
          - Teagasc                     # 7 repos
          - covidgreen                  # 14 repos (extended)
          - HSEIreland                  # 15 repos, all archived upstream
          - Oireachtas                  # 18 repos
          - CSOIreland                  # 35 repos, includes the 4.4 GiB outlier
          - IrishMarineInstitute        # 100 repos
      dry_run:
        description: "List what would be created, create nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: backfill-${{ inputs.org }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: git lfs install --skip-smudge

      - name: Plan
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          python scripts/enumerate.py --ns "${{ inputs.org }}" \
            --emit-changed --force-all > worklist.tsv
          echo "### Backfill plan: ${{ inputs.org }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat worklist.tsv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Backfill
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_ORG: ${{ github.repository_owner }}
          WORKDIR: ${{ runner.temp }}/work
        run: |
          set -uo pipefail
          mkdir -p "$WORKDIR"
          : > synced.txt
          while IFS=$'\t' read -r clone_url mirror_name default_branch tier; do
            [ -z "${clone_url:-}" ] && continue
            scripts/sync_repo.sh "$clone_url" "$mirror_name" "$default_branch" "$tier"
            case $? in
              0) echo "$mirror_name" >> synced.txt ;;
              4) echo "::warning::$mirror_name deferred - repo creation throttled" ;;
              *) echo "::error::backfill failed for $mirror_name" ;;
            esac
            rm -rf "$WORKDIR"/* || true
            # The real constraint is an undocumented secondary limit on
            # repository creation, hit after ~150 creations in under an hour.
            # sync_repo.sh backs off on its own; this just keeps the steady
            # rate below the threshold. Raise CREATE_PACE_SECONDS if a large
            # namespace still trips it.
            sleep "${CREATE_PACE_SECONDS:-20}"
          done < worklist.tsv

      - name: Record results
        if: ${{ always() && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          python scripts/enumerate.py --ns "${{ inputs.org }}" --update-manifest
          [ -s synced.txt ] && python scripts/enumerate.py --mark-synced synced.txt || true
          git config user.name "ie-gov-mirror bot"
          git config user.email "noreply@github.com"
          git add manifest/
          git diff --quiet --cached || \
            git commit -m "Backfill ${{ inputs.org }}: record mirrored repositories"
          git push origin HEAD:"${{ github.ref_name }}" || true
