name: enumerate upstream

# Re-enumerates the nine verified namespaces through the API rather than
# trusting the static research snapshot. ~13 API calls, so it runs daily.
#
# New repositories in those namespaces are accepted automatically and
# committed straight to the branch - the verified thing is the namespace, so a
# new repo inside one needs no separate approval. They are mirrored by the next
# sync run. Disappearances go to the tombstone flow, which never deletes.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  # Load-bearing: the commit step below pushes using the credentials
  # actions/checkout persists, which are GITHUB_TOKEN's.
  contents: write

concurrency:
  group: enumerate
  cancel-in-progress: false

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Drift report
        id: drift
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        # enumerate.py exits non-zero when there is drift needing attention,
        # which is information, not failure.
        run: python scripts/enumerate.py --report | tee drift.txt || true

      - name: Update manifest
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: python scripts/enumerate.py --update-manifest

      - name: Check for vanished upstreams
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_ORG: ${{ github.repository_owner }}
        run: python scripts/tombstone.py --check-all

      - name: Regenerate the deleted-repository report
        # docs/DELETED.md is generated from tombstones.csv so it cannot drift.
        run: python scripts/deleted_repo_report.py

      - name: Commit manifest
        run: |
          # Committed directly: new repos in verified namespaces are
          # auto-accepted, so there is nothing to approve. `git log
          # manifest/core.csv` remains the audit trail of what was added when,
          # and each auto-accepted row records the namespace it came from.
          git config user.name "ie-gov-mirror bot"
          git config user.email "noreply@github.com"
          git add manifest/ docs/DELETED.md
          if git diff --quiet --cached; then
            echo "no manifest changes"
            exit 0
          fi
          git commit -m "Update manifest from upstream enumeration"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: cat drift.txt >> "$GITHUB_STEP_SUMMARY" || true
