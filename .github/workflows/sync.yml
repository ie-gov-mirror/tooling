name: sync mirrors

# Weekly incremental refresh, sharded by upstream namespace. Gated on
# upstream pushed_at, so a typical run re-clones a handful of repositories
# rather than the whole 11.5 GiB. Also dispatched by the enumerate workflow,
# scoped to the namespaces where it has just auto-accepted new repositories.
#
# Shards only mirror. They cannot write the manifest - their token is
# read-only - and instead hand their results to a single record job. Twelve
# shards each committing and rebasing used to conflict on neighbouring CSV
# rows and silently drop records; one writer per run cannot race itself.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-sync every repository, ignoring pushed_at gating"
        type: boolean
        default: false
      namespaces:
        description: "Space-separated namespaces to sync (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      namespaces: ${{ steps.plan.outputs.namespaces }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose namespaces
        id: plan
        env:
          REQUESTED: ${{ inputs.namespaces }}
        run: |
          set -euo pipefail
          # The matrix comes from the manifest, so it cannot drift from it.
          known=$(python scripts/enumerate.py --list-namespaces)
          read -ra requested <<< "$REQUESTED"
          if [ "${#requested[@]}" -gt 0 ]; then
            for ns in "${requested[@]}"; do
              grep -qxF "$ns" <<< "$known" || { echo "::error::unknown namespace: $ns"; exit 1; }
            done
            chosen=$(printf '%s\n' "${requested[@]}")
          else
            chosen=$known
          fi
          echo "namespaces=$(jq -Rnc '[inputs | select(length > 0)]' <<< "$chosen")" >> "$GITHUB_OUTPUT"
          echo "syncing: $(xargs <<< "$chosen")"

  sync:
    needs: plan
    runs-on: ubuntu-latest
    # Six hours is the hard Actions job ceiling. The largest shard
    # (CSOIreland, ~6 GiB dominated by one 4.4 GiB repo) sits well inside it.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Three at a time keeps well clear of the 80 content-generating
      # requests/minute secondary limit and stays polite to upstream.
      max-parallel: 3
      matrix:
        org: ${{ fromJSON(needs.plan.outputs.namespaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git and LFS
        run: |
          git lfs install --skip-smudge
          git config --global advice.detachedHead false

      - name: Sync shard
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_ORG: ${{ github.repository_owner }}
          WORKDIR: ${{ runner.temp }}/work
          NS: ${{ matrix.org }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          : > "synced-$NS.txt"
          FORCE=""
          [ "$FORCE_ALL" = "true" ] && FORCE="--force-all"
          # No `|| true`: a bad token or an unlistable namespace must fail the
          # shard, not yield an empty worklist that passes as "nothing to do".
          python scripts/enumerate.py --ns "$NS" --emit-changed $FORCE > worklist.tsv
          echo "$(wc -l < worklist.tsv) repositories to sync"
          scripts/sync_worklist.sh worklist.tsv "synced-$NS.txt"

      - name: Hand results to the record job
        # Also after a failed sync: whatever did mirror must still be recorded.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synced-${{ matrix.org }}
          path: synced-${{ matrix.org }}.txt
          retention-days: 7

  record:
    needs: [plan, sync]
    # Runs when some shards failed, so the repositories that did mirror are
    # recorded. Skipped only if the run was cancelled or never planned.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The only job in this workflow that can write.
      contents: write
    # Shared with the enumerate workflow, the other manifest writer.
    concurrency:
      group: manifest-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: synced-*
          path: results
          merge-multiple: true

      - name: Record and commit
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          NAMESPACES: ${{ join(fromJSON(needs.plan.outputs.namespaces), ' ') }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(results/synced-*.txt)
          cat /dev/null "${files[@]}" > synced.txt
          echo "$(wc -l < synced.txt) repositories to record from ${#files[@]} shards"

          ns_args=()
          for ns in $NAMESPACES; do ns_args+=(--ns "$ns"); done
          # Update first so repositories auto-accepted mid-run have rows,
          # then stamp what mirrored. Both inside the retry, so a lost race
          # recomputes them on the newest tip instead of dropping them.
          scripts/commit_manifest.sh "Sync: record $(wc -l < synced.txt) mirrored repositories" \
            python scripts/enumerate.py "${ns_args[@]}" --update-manifest --mark-synced synced.txt
